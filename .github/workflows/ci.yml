name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Decision D7: the publish gate blocks the build on main only; PRs only get warnings.
      CONTENT_STRICT: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Lighthouse on the production build (M6): performance, accessibility, best practices, SEO.
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  # Cross-browser check (M6): the e2e suite at desktop width in Firefox and Safari (WebKit).
  cross-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=safari
        env:
          PW_ALL_BROWSERS: '1'
